services:

  dev:
    
    environment:
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      
    volumes:
      - /mnt/wslg:/mnt/wslg
      - /usr/lib/wsl:/usr/lib/wsl

    devices:
      - /dev/dxg:/dev/dxg
      - /dev/dri:/dev/dri
    
  app:

    environment:
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      
    volumes:
      - /mnt/wslg:/mnt/wslg

    devices:
      - /dev/dxg:/dev/dxg
